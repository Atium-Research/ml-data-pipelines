[project]
name = "ml-data-pipelines"
version = "0.1.0"
description = "Pipelines that pull option, stock and reference data and build the derived panels for the malatium stack."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bear-lake>=0.1.5",
    "click>=8.1",
    "lxml>=5.0",
    "malatium>=0.1.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.30",
    "pyarrow>=18.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "scipy>=1.14",
    "thetadata>=1.0.10",
    "yfinance>=0.2.50",
]

[project.scripts]
pipelines = "pipelines.__main__:cli"

[project.urls]
Repository = "https://github.com/Atium-Research/ml-data-pipelines"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # frozen dataclass configs as argument defaults are immutable and intended
